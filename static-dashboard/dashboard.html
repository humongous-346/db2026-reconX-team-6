<!doctype html>
<!--
========================================
CSS Grid page shell (sidebar + header)
Semantic HTML5 (header/nav/main/aside)
ARIA roles + aria-live for the trade feed
========================================
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <title>ReconX (static) - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- FOUC Prevention: Read theme before CSS loads -->
  <script>
    (function() {
      const saved = localStorage.getItem('reconx-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="layout__header">
    <h1 class="layout__title">ReconX</h1>
    <nav class="layout__nav" aria-label="Main menu">
      <a href="dashboard.html" aria-current="page">Dashboard</a>
      <a href="trades.html">Trades</a>
      <a href="recon.html">Recon</a>
    </nav>
    <!-- Added aria-pressed attribute -->
    <button id="theme-toggle" aria-pressed="false" aria-label="Toggle Theme">Theme</button>
  </header>

  <aside class="layout__sidebar">
    <h2>Quick filters</h2>
    <ul>
      <li><a href="#">All trades</a></li>
      <li><a href="#">Open breaks</a></li>
      <li><a href="#">Today</a></li>
    </ul>
  </aside>

  <main class="layout__main" role="main">
    <section aria-labelledby="kpi">
      <h2 id="kpi">Today at a glance</h2>
      <div class="stat-grid">
        <article class="stat-card">Card 1</article>
        <article class="stat-card">Card 2</article>
        <article class="stat-card">Card 3</article>
      </div>
    </section>

    <section aria-labelledby="feed">
      <h2 id="feed">Live trade feed</h2>
      <!-- aria-live so screen readers announce new trades -->
      <div id="trade-feed" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="layout__footer">
    <small>ReconX TDI 2026 · static prototype</small>
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/sse.js"></script>
</body>
</html>
